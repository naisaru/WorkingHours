name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download pixel font (Press Start 2P, OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/PressStart2P-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/pressstart2p/PressStart2P-Regular.ttf \
            || echo "Font download failed, app will use fallback font"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WorkingHours-1-2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkingHours-1-2
          path: WorkingHours-1-2.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Working hours 1/2 (сборка ${{ github.run_number }})
          files: WorkingHours-1-2.apk
